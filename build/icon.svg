<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Zenbook: a hand-drawn ensō and an open ripple around a soft red stone, on a warm
       ink tile. Apple grid: the 824 tile sits at 100,100. scripts/make-icon.mjs renders
       every size from this file; the .ico and window icon crop it full-bleed and drop
       the #shadow group. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A463F"/>
      <stop offset="1" stop-color="#2B2A26"/>
    </linearGradient>
    <radialGradient id="glow" cx="546" cy="484" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2B9A8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#F2B9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="220" x2="0" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F2E8"/>
      <stop offset="1" stop-color="#E4D9C6"/>
    </linearGradient>
    <radialGradient id="stone" cx="524.3" cy="459.2" r="93" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE9284"/>
      <stop offset="0.55" stop-color="#DE7366"/>
      <stop offset="1" stop-color="#BF5A50"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
