<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Zenbook: a hand-drawn ensō, and a pencil finishing the ripple inside it, on a warm
       ink tile. Apple grid: the 824 tile sits at 100,100. scripts/make-icon.mjs renders
       every size from this file; the .ico and window icon crop it full-bleed and drop
       the #shadow group. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A463F"/>
      <stop offset="1" stop-color="#2B2A26"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="460" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2D9C8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#F2D9C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="220" x2="0" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F2E8"/>
      <stop offset="1" stop-color="#E4D9C6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="-23" x2="0" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3E6CF"/>
      <stop offset="1" stop-color="#D7BF9A"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="-23" x2="0" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2EADB"/>
      <stop offset="0.5" stop-color="#D8CAAE"/>
      <stop offset="1" stop-color="#A9987A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
