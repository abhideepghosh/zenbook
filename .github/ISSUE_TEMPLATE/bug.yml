name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a page with…
        2. Press…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zenbook version
      description: Shown under "… → About Zenbook".
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: sync
    attributes:
      label: Is your library in a synced folder?
      description: For example Dropbox, iCloud Drive, OneDrive, Syncthing or git. Leave empty if not.
